AWSTemplateFormatVersion: '2010-09-09'
Description: 'aaaa'

Resources:
  SampleS3ReadPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'PB-Admin-Policy'
      Roles:
        - madebyprity
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - '*'