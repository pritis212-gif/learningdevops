AWSTemplateFormatVersion: '2010-09-09'
Description: iam role demo

Resources:
  MyCustomIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: madebyprity
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ec2-s3-policy-demo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - "*"